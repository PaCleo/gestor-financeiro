services:
  postgres:
    image: postgres:16
    container_name: gestor-financeiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor
    ports:
      - "5432:5432"
    volumes:
      - gestor_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestor_postgres_data:
